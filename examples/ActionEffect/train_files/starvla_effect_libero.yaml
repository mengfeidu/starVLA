run_id: qweneffect_libero
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_Libero_QwenEffect
is_debug: false
version_id: "0.21"

framework:
  name: QwenEffect
  qwenvl:
    # Checkpoint produced by add_effect_tokens.py (FAST + effect special tokens).
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct-ActionEffect
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_model_type: FAST
    action_dim: 7
    action_horizon: 8
    fast_tokenizer_path: ./playground/Pretrained_models/fast
  effect:
    # Stage-1 effect tokenizer checkpoint (frozen during Stage 2).
    tokenizer_ckpt: ./playground/Checkpoints/effect_tok/checkpoints/effect_tokenizer.pt
    decode_mode: ar          # "ar" = VLM generates effect+action tokens; "decoder" = use Stage-1 D_a
    # execution_mode: how low-level actions are produced.
    #   "fast" = discrete FAST tokens after the effect plan (default, pure AR).
    #   "flow" = continuous flow-matching head conditioned on VLM hidden state
    #            (wall-oss style: effect tokens plan, flow head executes precisely).
    execution_mode: fast
    lambda_flow: 1.0         # weight of the flow-matching loss when execution_mode=flow
    flow_sample_steps: 10    # Euler steps at inference for the flow head

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LIBERO
    data_mix: libero_all_effect      # registered by ActionEffect/train_files/data_registry
    action_type: delta_qpos
    sequential_step_sampling: False
    include_future_obs: true         # makes the dataloader expose o_{t+H} as future_image
    per_device_batch_size: 16
    load_all_data_for_training: true
    video_backend: torchvision_av

trainer:
  max_train_steps: 80000
  num_warmup_steps: 8000
  save_interval: 10000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  # The frozen Stage-1 tokenizer must never be optimized.
  freeze_modules: 'effect_tokenizer'
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
